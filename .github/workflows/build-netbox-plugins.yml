name: Build NetBox plugins image

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      netbox_version:
        description: "Optional NetBox version, without the v prefix"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/netbox-plugins

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve NetBox version
        id: netbox
        env:
          REQUESTED_VERSION: ${{ inputs.netbox_version }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          else
            version="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/netbox-community/netbox/releases/latest \
              | jq -r '.tag_name // empty' | sed 's/^v//')"
          fi

          case "$version" in
            ''|*[!0-9.]*|.*|*.)
              echo "Invalid NetBox version: $version" >&2
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using NetBox $version"

      - name: Verify NetBox base image exists
        env:
          NETBOX_VERSION: ${{ steps.netbox.outputs.version }}
        run: |
          set -euo pipefail
          docker manifest inspect "ghcr.io/netbox-community/netbox:v${NETBOX_VERSION}" >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NETBOX_VERSION=${{ steps.netbox.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.netbox.outputs.version }}-plugins
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-plugins
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=ghcr.io/netbox-community/netbox:v${{ steps.netbox.outputs.version }}